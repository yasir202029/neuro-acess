name: CD — Deploy to Railway

on:
  push:
    branches: [main, staging, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Railway environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

concurrency:
  group: cd-railway-${{ github.ref }}
  cancel-in-progress: true

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  NODE_VERSION: 24.21.0

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/staging' && 'staging' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm run build
      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest
      - name: Link Railway project
        run: railway link ${{ secrets.RAILWAY_PROJECT_ID }}
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
      - name: Deploy to ${{ github.ref }}
        run: |
          case "${{ github.ref }}" in
            refs/heads/main) railway up --environment production --detach ;;
            refs/heads/staging) railway up --environment staging --detach ;;
            *) railway up --environment development --detach ;;
          esac
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
      - name: Verify health endpoint
        run: |
          echo "Railway deploy triggered for ${{ github.ref }}."
          echo "Confirm health via the Railway dashboard for the deployed service."
