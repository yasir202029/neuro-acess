name: CI — NeuroAssess

on:
  push:
    branches: [main, staging, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  changed-files:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.filter.outputs.libs }}
      apps: ${{ steps.filter.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            libs:
              - 'lib/**'
              - 'packages/**'
              - 'pnpm-workspace.yaml'
            apps:
              - 'apps/**'
              - 'artifacts/**'

  typecheck:
    name: Typecheck (libs + apps)
    needs: changed-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck shared libs
        run: pnpm run typecheck:libs
      - name: Typecheck apps & artifacts
        run: pnpm run typecheck

  unit-tests:
    name: Unit tests (vitest)
    needs: changed-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm -r run test --if-present

  build:
    name: Build (api-server + neuroassess-web)
    needs: [typecheck, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm run build
      - name: Upload api-server dist
        uses: actions/upload-artifact@v4
        with:
          name: api-server-dist
          path: artifacts/api-server/dist/
          retention-days: 7
      - name: Upload neuroassess-web dist
        uses: actions/upload-artifact@v4
        with:
          name: neuroassess-web-dist
          path: artifacts/neuroassess-web/dist/
          retention-days: 7

  security:
    name: Secret / leak scan
    needs: changed-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan for committed secrets (.env, PATs, keys)
        run: |
          set -e
          if git grep -I -n -- '^\(NEXT_PUBLIC_\|SUPABASE_\|STRIPE_\|OPENAI_\|ANTHROPIC_\|GOOGLE_AI_\|OPENROUTER_\|RESEND_\|SENDGRID_\|AWS_\|DATABASE_URL\)=' '*.env' '.env*' 2>/dev/null; then
            echo "::error::Committed secret file detected"; exit 1;
          fi
          if git grep -I -n -- 'ghp_[A-Za-z0-9]\|github_pat_[A-Za-z0-9_]\|sk_live_[A-Za-z0-9]\|sk_test_[A-Za-z0-9]' . 2>/dev/null; then
            echo "::error::Possible hard-coded token/key detected"; exit 1;
          fi
          echo "No secrets detected in repository."

  ci-complete:
    name: CI gate
    needs: [typecheck, unit-tests, build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Report CI result
        run: echo "CI gate passed: typecheck, unit tests, build, and security scan all green."
